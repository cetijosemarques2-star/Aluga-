<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Museu Literário Digital</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Cormorant Garamond & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .font-serif {
      font-family: 'Cormorant Garamond', serif;
    }
    /* Animação suave e sincronizada de folhear página (500ms) */
    .page-flip {
      transition: transform 0.5s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.3s ease;
      transform-style: preserve-3d;
      transform-origin: left center;
    }
    .flipping {
      transform: rotateY(-80deg);
      opacity: 0.1;
    }
  </style>
</head>
<body class="bg-[#E5D7C4] text-[#102820] h-screen overflow-hidden flex flex-col lg:flex-row">

  <!-- ==========================================
      MENU LATERAL ESQUERDO (RESPONSIVO)
      ========================================== -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-[#102820] text-[#E5D7C4] transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col shadow-2xl">
    <div class="p-5 border-b border-[#4C6444]/40 flex items-center justify-between cursor-pointer shrink-0" onclick="switchTab('home')">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-lg bg-[#4C6444] flex items-center justify-center shadow-md shrink-0">
          <i data-lucide="book-open" class="w-5 h-5 text-[#E5D7C4]"></i>
        </div>
        <div>
          <h1 class="font-serif text-base font-bold tracking-wide text-white leading-tight">Museu Literário</h1>
          <p class="text-[9px] text-[#B3B792] tracking-wider uppercase">Digital & Cultural</p>
        </div>
      </div>
      <button onclick="toggleMobileMenu()" class="lg:hidden text-[#B3B792] hover:text-white p-1">
        <i data-lucide="x" class="w-6 h-6"></i>
      </button>
    </div>

    <!-- Navegação -->
    <nav class="flex-1 px-3 py-4 space-y-1.5 overflow-y-auto">
      <button onclick="switchTab('home')" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-200" data-tab="home">
        <i data-lucide="book-marked" class="w-4 h-4 shrink-0"></i>
        <span>Início</span>
      </button>
      <button onclick="switchTab('catalog')" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-200" data-tab="catalog">
        <i data-lucide="library" class="w-4 h-4 shrink-0"></i>
        <span>Acervo Literário</span>
      </button>
      <button onclick="switchTab('gallery')" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-200" data-tab="gallery">
        <i data-lucide="image" class="w-4 h-4 shrink-0"></i>
        <span>Galeria Fotográfica</span>
      </button>
      <button onclick="switchTab('audiovisual')" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-200" data-tab="audiovisual">
        <i data-lucide="video" class="w-4 h-4 shrink-0"></i>
        <span>Área Audiovisual</span>
      </button>
      <button onclick="switchTab('about')" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-200" data-tab="about">
        <i data-lucide="info" class="w-4 h-4 shrink-0"></i>
        <span>Sobre o Museu</span>
      </button>
      <button onclick="switchTab('admin')" class="nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-200" data-tab="admin">
        <i data-lucide="shield" class="w-4 h-4 shrink-0"></i>
        <span>Painel Administrativo</span>
      </button>
    </nav>

    <div class="p-3 border-t border-[#4C6444]/40 bg-[#0c1f18] text-[11px] text-[#B3B792] text-center shrink-0">
      <p>© 2026 Museu Literário Digital</p>
    </div>
  </aside>

  <!-- Overlay Mobile -->
  <div id="mobileOverlay" onclick="toggleMobileMenu()" class="fixed inset-0 bg-black/60 z-40 lg:hidden hidden backdrop-blur-sm"></div>

  <!-- ==========================================
      CONTEÚDO PRINCIPAL
      ========================================== -->
  <main class="flex-1 flex flex-col lg:pl-72 h-screen overflow-hidden bg-[#E5D7C4] w-full">
    
    <!-- Barra Superior -->
    <header class="h-14 sm:h-16 bg-[#102820] text-[#E5D7C4] px-4 sm:px-6 flex items-center justify-between shadow-md z-30 shrink-0">
      <div class="flex items-center space-x-3 min-w-0">
        <button onclick="toggleMobileMenu()" class="lg:hidden p-2 rounded-lg bg-[#4C6444] text-white focus:outline-none shrink-0">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
        <span id="headerTitle" class="font-serif text-base sm:text-lg font-medium text-white truncate">Página Inicial</span>
      </div>
    </header>

    <!-- Área Rolável -->
    <div id="contentArea" class="flex-1 overflow-y-auto">
      <!-- Conteúdo injetado via JS -->
    </div>
  </main>

  <!-- ==========================================
      LEITOR EM TELA CHEIA TOTAL (OTIMIZADO MOBILE)
      ========================================== -->
  <div id="pdfReaderModal" class="fixed inset-0 z-50 flex flex-col bg-[#2c221a] text-[#F4ECD8] hidden">
    <!-- Cabeçalho do Leitor -->
    <div id="readerHeader" class="h-14 sm:h-16 px-3 sm:px-6 flex items-center justify-between border-b border-[#433422] bg-[#1a130f] shrink-0">
      <div class="overflow-hidden pr-2 min-w-0">
        <h3 id="readerBookTitle" class="font-serif font-bold text-sm sm:text-base truncate">Título da Obra</h3>
        <p id="readerBookAuthor" class="text-[10px] sm:text-xs opacity-75 truncate">Autor</p>
      </div>
      <div class="flex items-center space-x-2 sm:space-x-3 shrink-0">
        <span id="pageIndicator" class="hidden sm:inline-block text-xs font-mono bg-black/30 px-3 py-1 rounded-lg">Página 1 de 3</span>
        <button onclick="closePdfReader()" id="closeReaderBtn" class="bg-red-600 text-white p-2 rounded-xl hover:bg-red-700 transition flex items-center justify-center">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
    
    <!-- Visualizador Dinâmico -->
    <div id="readerBodyContainer" class="flex-1 flex items-center justify-center p-2 sm:p-6 perspective-[1500px] overflow-hidden w-full h-full">
      <!-- Injetado dinamicamente -->
    </div>
  </div>

  <!-- ==========================================
      SCRIPT DA APLICAÇÃO
      ========================================== -->
  <script>
    let state = {
      activeTab: 'home',
      isAdminAuth: false,
      searchTerm: '',
      selectedCategoryFilter: 'all',
      selectedBookId: null,
      currentPage: 1,
      totalPages: 1,
      
      books: [
        {
          id: '1',
          title: 'Crônicas da Terra Vermelha',
          subtitle: 'Memórias e paisagens do interior',
          author: 'Mariana Silva',
          synopsis: 'Uma coletânea sensível de crônicas sobre a infância no interior, os cheiros da terra molhada, as tardes de outono e a sabedoria dos antigos.',
          category: 'Crônica',
          year: '2025',
          coverUrl: 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&q=80&w=600',
          pdfUrl: '',
          status: 'published',
          featured: true,
          shelf: 'Crônicas',
          pages: [
            "Capítulo I\n\nA terra vermelha guardava os segredos das primeiras chuvas de novembro. Quando o cheiro de mato molhado subia pelo vale, sabíamos que o tempo havia mudado de ritmo.",
            "As tardes eram longas na varanda da casa de vó. Entre um gole de café coado na hora e histórias contadas à sombra da mangueira, o mundo lá fora parecia distante e seguro.",
            "Hoje, mesmo longe daquela paisagem, basta fechar os olhos para ouvir o vento balançar os cafezais. As raízes que lá deixamos continuam a nutrir quem somos."
          ]
        },
        {
          id: '2',
          title: 'Versos do Sertão Verde',
          subtitle: 'Poesia popular e contemporânea',
          author: 'Antônio Bezerra',
          synopsis: 'Poemas que cantam a força da caatinga, a resiliência do povo nordestino e a beleza das chuvas que transformam a paisagem.',
          category: 'Poesia',
          year: '2026',
          coverUrl: 'https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&q=80&w=600',
          pdfUrl: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf',
          status: 'published',
          featured: true,
          shelf: 'Literatura nordestina',
          pages: []
        }
      ],
      categories: ['Conto', 'Crônica', 'Poesia', 'Literatura nordestina', 'Produção escolar', 'Romance'],
      gallery: [
        { id: '1', title: 'Oficina de Contação de Histórias', description: 'Alunos reunidos na biblioteca ao ar livre.', imageUrl: 'https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&q=80&w=800', date: 'Agosto, 2026', project: 'Festival' }
      ],
      videos: [
        { id: '1', title: 'Documentário: Vozes da Terra', description: 'Panorama sobre literatura oral.', videoUrl: 'https://www.youtube.com/embed/dQw4w9WgXcQ', category: 'Documentário' }
      ]
    };

    const shelvesConfig = [
      { title: 'Obras em destaque', shelfName: 'Obras em destaque' },
      { title: 'Crônicas', shelfName: 'Crônicas' },
      { title: 'Literatura nordestina', shelfName: 'Literatura nordestina' },
      { title: 'Novas publicações', shelfName: 'Novas publicações' }
    ];

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function switchTab(tab) {
      state.activeTab = tab;
      render();
      closeMobileMenu();
    }

    function toggleMobileMenu() {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
      document.getElementById('mobileOverlay').classList.toggle('hidden');
    }

    function closeMobileMenu() {
      document.getElementById('sidebar').classList.add('-translate-x-full');
      document.getElementById('mobileOverlay').classList.add('hidden');
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeMobileMenu();
        closePdfReader();
      }
    });

    function render() {
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const tab = btn.getAttribute('data-tab');
        if (tab === state.activeTab || (state.activeTab === 'book-detail' && tab === 'catalog')) {
          btn.className = 'nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl text-sm font-medium bg-[#4C6444] text-white shadow-md';
        } else {
          btn.className = 'nav-btn w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl text-sm font-medium text-[#B3B792] hover:bg-[#15352a] hover:text-white transition-all';
        }
      });

      const titles = {
        home: 'Página Inicial',
        catalog: 'Acervo Completo',
        'book-detail': 'Detalhes da Obra',
        gallery: 'Galeria Fotográfica',
        audiovisual: 'Área Audiovisual',
        about: 'Sobre o Projeto',
        admin: 'Painel Administrativo'
      };
      
      document.getElementById('headerTitle').textContent = titles[state.activeTab] || 'Museu Literário';

      const area = document.getElementById('contentArea');
      area.innerHTML = '';

      if (state.activeTab === 'home') area.innerHTML = renderHome();
      else if (state.activeTab === 'catalog') area.innerHTML = renderCatalog();
      else if (state.activeTab === 'book-detail') area.innerHTML = renderBookDetail();
      else if (state.activeTab === 'gallery') area.innerHTML = renderGallery();
      else if (state.activeTab === 'audiovisual') area.innerHTML = renderAudiovisual();
      else if (state.activeTab === 'about') area.innerHTML = renderAbout();
      else if (state.activeTab === 'admin') area.innerHTML = renderAdmin();

      lucide.createIcons();
    }

    function renderHome() {
      let shelvesHtml = shelvesConfig.map(shelf => {
        const shelfBooks = state.books.filter(b => b.status === 'published' && (b.shelf === shelf.shelfName || (shelf.shelfName === 'Obras em destaque' && b.featured)));
        if (shelfBooks.length === 0) return '';

        let booksCards = shelfBooks.map(book => `
          <div class="w-48 sm:w-56 shrink-0 bg-[#F4EFE6] rounded-2xl shadow-md overflow-hidden border border-[#CFBB99]/60 flex flex-col group">
            <div class="relative h-60 sm:h-72 overflow-hidden bg-[#d3c1a5]">
              <img src="${escapeHtml(book.coverUrl)}" alt="${escapeHtml(book.title)}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
              <div class="absolute top-2.5 left-2.5 bg-[#102820]/80 text-[#E5D7C4] text-[9px] sm:text-[10px] px-2 py-0.5 rounded-full font-semibold uppercase">
                ${escapeHtml(book.category)}
              </div>
            </div>
            <div class="p-3.5 flex-1 flex flex-col justify-between">
              <div>
                <h3 class="font-serif font-bold text-sm sm:text-base text-[#102820] line-clamp-1">${escapeHtml(book.title)}</h3>
                <p class="text-[11px] sm:text-xs text-[#8A6240] font-medium mt-0.5 line-clamp-1">${escapeHtml(book.author)}</p>
              </div>
              <div class="mt-3 pt-2.5 border-t border-[#CFBB99]/40 flex items-center justify-between">
                <span class="text-[10px] sm:text-[11px] text-[#889063] font-semibold">${escapeHtml(book.year)}</span>
                <button onclick="openBook('${book.id}')" class="bg-[#4C6444] hover:bg-[#394c33] text-white text-xs px-3 py-1 rounded-lg font-medium transition shadow">
                  Ler
                </button>
              </div>
            </div>
          </div>
        `).join('');

        return `
          <div class="space-y-3">
            <div class="flex items-center justify-between border-b border-[#889063]/30 pb-2">
              <h2 class="text-lg sm:text-2xl font-serif font-bold text-[#102820] flex items-center space-x-2">
                <span class="w-2 h-2 rounded-full bg-[#4C6444]"></span>
                <span>${escapeHtml(shelf.title)}</span>
              </h2>
            </div>
            <div class="flex space-x-3.5 sm:space-x-6 overflow-x-auto pb-3 pt-1 scrollbar-thin">
              ${booksCards}
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="min-h-full flex flex-col">
          <div class="bg-[#102820] text-white py-10 sm:py-16 px-4 sm:px-8 flex flex-col items-center justify-center text-center shadow-xl">
            <h1 class="text-2xl sm:text-4xl lg:text-5xl font-serif font-bold text-[#E5D7C4] leading-tight max-w-2xl">
              “Um lugar para as histórias viverem.”
            </h1>
            <p class="text-xs sm:text-base lg:text-lg text-[#B3B792] font-light max-w-lg mx-auto mt-2 sm:mt-3">
              Explore livros, poemas e memórias que atravessam gerações.
            </p>
            <button onclick="switchTab('catalog')" class="mt-5 bg-[#4C6444] hover:bg-[#5d7954] text-white px-6 py-2.5 rounded-xl font-medium shadow transition text-xs sm:text-sm">
              Explorar Acervo
            </button>
          </div>
          <div class="py-6 sm:py-10 px-4 sm:px-6 lg:px-12 space-y-8 sm:space-y-10 max-w-7xl mx-auto w-full">
            ${shelvesHtml}
          </div>
        </div>
      `;
    }

    function renderCatalog() {
      let categoriesBtns = `<button onclick="setCategoryFilter('all')" class="px-3 py-1.5 rounded-xl text-xs font-semibold shadow-sm shrink-0 ${state.selectedCategoryFilter === 'all' ? 'bg-[#102820] text-white' : 'bg-[#F4EFE6] text-[#4D2D18]'}">Todas</button>`;
      categoriesBtns += state.categories.map(c => `
        <button onclick="setCategoryFilter('${c}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold shadow-sm shrink-0 ${state.selectedCategoryFilter === c ? 'bg-[#102820] text-white' : 'bg-[#F4EFE6] text-[#4D2D18]'}">${escapeHtml(c)}</button>
      `).join('');

      return `
        <div class="p-4 sm:p-6 lg:p-12 max-w-7xl mx-auto space-y-5 sm:space-y-8">
          <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
            <div>
              <h1 class="text-xl sm:text-3xl font-serif font-bold text-[#102820]">Acervo Literário</h1>
              <p class="text-xs sm:text-sm text-[#4D2D18] mt-0.5">Pesquise por título, autor, sinopse ou categoria.</p>
            </div>
            <div class="relative w-full md:w-80">
              <i data-lucide="search" class="absolute left-3 top-3 w-4 h-4 text-[#8A6240]"></i>
              <input type="text" placeholder="Pesquisar..." value="${escapeHtml(state.searchTerm)}" oninput="state.searchTerm = this.value; renderCatalogGrid()" class="w-full bg-[#F4EFE6] border border-[#CFBB99] rounded-xl pl-9 pr-4 py-2 text-xs sm:text-sm focus:outline-none">
            </div>
          </div>
          <div class="flex items-center space-x-2 overflow-x-auto pb-1.5">${categoriesBtns}</div>
          <div id="booksGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
            ${getFilteredBooksHTML()}
          </div>
        </div>
      `;
    }

    function getFilteredBooksHTML() {
      const termo = state.searchTerm.trim().toLowerCase();

      let filtered = state.books.filter(b => b.status === 'published')
        .filter(b => state.selectedCategoryFilter === 'all' || b.category === state.selectedCategoryFilter)
        .filter(book =>
          book.title.toLowerCase().includes(termo) ||
          book.author.toLowerCase().includes(termo) ||
          (book.subtitle || '').toLowerCase().includes(termo) ||
          (book.synopsis || '').toLowerCase().includes(termo) ||
          book.category.toLowerCase().includes(termo)
        );

      if (filtered.length === 0) return `<div class="col-span-full py-12 text-center text-xs sm:text-sm text-[#8A6240]">Nenhuma obra encontrada.</div>`;

      return filtered.map(book => `
        <div class="bg-[#F4EFE6] rounded-2xl shadow-md overflow-hidden border border-[#CFBB99] flex flex-col">
          <div class="relative h-64 sm:h-72 bg-[#d3c1a5] overflow-hidden">
            <img src="${escapeHtml(book.coverUrl)}" class="w-full h-full object-cover">
            <div class="absolute top-2.5 left-2.5 bg-[#102820]/80 text-[#E5D7C4] text-[9px] sm:text-[10px] px-2 py-0.5 rounded-full font-semibold">
              ${escapeHtml(book.category)}
            </div>
          </div>
          <div class="p-3.5 sm:p-4 flex-1 flex flex-col justify-between">
            <div>
              <h3 class="font-serif font-bold text-base text-[#102820] line-clamp-1">${escapeHtml(book.title)}</h3>
              <p class="text-xs text-[#8A6240] font-medium mt-0.5">${escapeHtml(book.author)}</p>
            </div>
            <div class="mt-3.5 pt-2.5 border-t border-[#CFBB99] flex items-center justify-between">
              <span class="text-xs text-[#889063] font-semibold">${escapeHtml(book.year)}</span>
              <button onclick="openBook('${escapeHtml(book.id)}')" class="bg-[#4C6444] text-white text-xs px-3.5 py-1.5 rounded-lg font-medium shadow">Ver Detalhes</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderCatalogGrid() {
      const grid = document.getElementById('booksGrid');
      if (grid) grid.innerHTML = getFilteredBooksHTML();
    }

    function renderBookDetail() {
      const book = state.books.find(b => b.id === state.selectedBookId);
      if (!book) return `<div class="p-12 text-center text-xs sm:text-sm">Obra não encontrada. <button onclick="switchTab('catalog')" class="text-[#4C6444] underline">Voltar</button></div>`;

      return `
        <div class="p-4 sm:p-6 lg:p-12 max-w-4xl mx-auto space-y-5 sm:space-y-8">
          <button onclick="switchTab('catalog')" class="flex items-center space-x-1.5 text-[#4C6444] font-medium text-xs sm:text-sm">
            <i data-lucide="chevron-left" class="w-4 h-4"></i><span>Voltar ao Acervo</span>
          </button>
          <div class="bg-[#F4EFE6] rounded-2xl sm:rounded-3xl p-5 sm:p-8 shadow-xl border border-[#CFBB99] grid grid-cols-1 md:grid-cols-3 gap-5 sm:gap-8">
            <div class="md:col-span-1 flex flex-col items-center">
              <div class="rounded-xl overflow-hidden shadow-xl aspect-[3/4] border border-[#CFBB99] w-44 sm:w-52 md:w-full">
                <img src="${escapeHtml(book.coverUrl)}" class="w-full h-full object-cover">
              </div>
              <button onclick="openPdfReader('${escapeHtml(book.id)}')" class="w-full mt-4 flex items-center justify-center space-x-2 bg-[#4C6444] hover:bg-[#394c33] text-white py-2.5 px-4 rounded-xl text-xs sm:text-sm font-medium shadow transition">
                <i data-lucide="book-open" class="w-4 h-4"></i><span>Ler Obra</span>
              </button>
            </div>
            <div class="md:col-span-2 space-y-3 sm:space-y-4">
              <span class="inline-block bg-[#102820] text-[#E5D7C4] text-[10px] sm:text-xs px-2.5 py-0.5 rounded-full uppercase">${escapeHtml(book.category)}</span>
              <h1 class="text-xl sm:text-3xl font-serif font-bold text-[#102820] leading-tight">${escapeHtml(book.title)}</h1>
              <p class="text-xs sm:text-base text-[#8A6240] font-serif italic">${escapeHtml(book.subtitle || '')}</p>
              <p class="text-xs sm:text-sm font-semibold text-[#4C6444]">Autor: ${escapeHtml(book.author)}</p>
              <div class="border-t border-[#CFBB99] pt-3 sm:pt-4">
                <h3 class="font-serif font-bold text-base sm:text-lg text-[#102820] mb-1.5">Sinopse</h3>
                <p class="text-xs sm:text-sm text-[#4D2D18] leading-relaxed">${escapeHtml(book.synopsis)}</p>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderGallery() {
      let cards = state.gallery.map(item => `
        <div class="bg-[#F4EFE6] rounded-2xl overflow-hidden shadow-md border border-[#CFBB99] flex flex-col">
          <div class="h-48 sm:h-64 bg-[#d3c1a5] relative">
            <img src="${escapeHtml(item.imageUrl)}" class="w-full h-full object-cover">
          </div>
          <div class="p-4 sm:p-5">
            <h3 class="font-serif font-bold text-base sm:text-lg text-[#102820]">${escapeHtml(item.title)}</h3>
            <p class="text-[11px] sm:text-xs text-[#4D2D18] mt-1.5">${escapeHtml(item.description)}</p>
          </div>
        </div>
      `).join('');

      return `<div class="p-4 sm:p-6 lg:p-12 max-w-7xl mx-auto space-y-5 sm:space-y-8"><h1 class="text-xl sm:text-3xl font-serif font-bold text-[#102820]">Galeria Fotográfica</h1><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">${cards}</div></div>`;
    }

    function renderAudiovisual() {
      let cards = state.videos.map(vid => `
        <div class="bg-[#F4EFE6] rounded-2xl overflow-hidden shadow-md border border-[#CFBB99]">
          <div class="aspect-video bg-black">
            <iframe src="${escapeHtml(vid.videoUrl)}" class="w-full h-full" allowfullscreen></iframe>
          </div>
          <div class="p-4 sm:p-6 space-y-1.5">
            <h3 class="font-serif font-bold text-base sm:text-xl text-[#102820]">${escapeHtml(vid.title)}</h3>
            <p class="text-xs sm:text-sm text-[#4D2D18]">${escapeHtml(vid.description)}</p>
          </div>
        </div>
      `).join('');

      return `<div class="p-4 sm:p-6 lg:p-12 max-w-7xl mx-auto space-y-5 sm:space-y-8"><h1 class="text-xl sm:text-3xl font-serif font-bold text-[#102820]">Área Audiovisual</h1><div class="grid grid-cols-1 lg:grid-cols-2 gap-6 sm:gap-8">${cards}</div></div>`;
    }

    function renderAbout() {
      return `
        <div class="p-4 sm:p-6 lg:p-12 max-w-4xl mx-auto">
          <div class="bg-[#F4EFE6] rounded-2xl sm:rounded-3xl p-6 sm:p-12 shadow-xl border border-[#CFBB99] space-y-4 sm:space-y-6">
            <h1 class="text-xl sm:text-4xl font-serif font-bold text-[#102820]">Sobre o Museu Literário Digital</h1>
            <p class="text-xs sm:text-base text-[#4D2D18] leading-relaxed">
              Plataforma dedicada à preservação, organização e divulgação da literatura e produções culturais.
            </p>
          </div>
        </div>
      `;
    }

    function renderAdmin() {
      if (!state.isAdminAuth) {
        return `
          <div class="max-w-md mx-auto bg-[#F4EFE6] rounded-2xl sm:rounded-3xl p-6 sm:p-8 shadow-2xl border border-[#CFBB99] space-y-5 mt-6 sm:mt-12 mx-4 sm:mx-auto">
            <div class="text-center space-y-1.5">
              <i data-lucide="shield" class="w-10 h-10 text-[#4C6444] mx-auto"></i>
              <h2 class="text-xl sm:text-2xl font-serif font-bold text-[#102820]">Área Restrita</h2>
              <p class="text-[11px] sm:text-xs text-[#4D2D18]">Insira a chave de acesso administrativo</p>
            </div>
            <form onsubmit="handleAdminLogin(event)" class="space-y-3.5">
              <input id="adminPassInput" type="password" placeholder="Senha..." class="w-full bg-white border border-[#CFBB99] rounded-xl px-4 py-2.5 text-xs sm:text-sm focus:outline-none" required>
              <button type="submit" class="w-full bg-[#102820] text-white py-2.5 rounded-xl font-medium text-xs sm:text-sm shadow-lg">Entrar</button>
            </form>
          </div>
        `;
      }

      let booksList = state.books.map(b => `
        <div class="bg-white p-3 rounded-xl border border-[#CFBB99] flex items-center justify-between shadow-sm">
          <div class="pr-2 min-w-0">
            <h4 class="font-serif font-bold text-xs sm:text-sm text-[#102820] truncate">${escapeHtml(b.title)}</h4>
            <p class="text-[10px] sm:text-[11px] text-[#8A6240] truncate">${escapeHtml(b.author)} • ${escapeHtml(b.category)}</p>
          </div>
          <button onclick="deleteBook('${escapeHtml(b.id)}')" class="p-1.5 bg-red-100 text-red-700 rounded-lg shrink-0"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
        </div>
      `).join('');

      return `
        <div class="p-4 sm:p-6 lg:p-12 max-w-7xl mx-auto space-y-5 sm:space-y-8">
          <div class="flex items-center justify-between bg-[#F4EFE6] p-3.5 rounded-xl border border-[#CFBB99]">
            <span class="text-xs sm:text-sm font-bold text-[#102820]">Painel Administrativo</span>
            <button onclick="state.isAdminAuth=false; render();" class="text-xs text-red-700 font-semibold">Sair</button>
          </div>
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 sm:gap-8">
            <div class="bg-[#F4EFE6] p-5 sm:p-6 rounded-2xl sm:rounded-3xl shadow-lg border border-[#CFBB99] space-y-3.5">
              <h3 class="font-serif font-bold text-base sm:text-lg text-[#102820]">Cadastrar Obra</h3>
              <form id="bookForm" onsubmit="handleSaveBook(event)" class="space-y-2.5">
                <input id="fTitle" placeholder="Título *" class="w-full bg-white border border-[#CFBB99] rounded-xl px-3 py-2 text-xs focus:outline-none" required>
                <input id="fSubtitle" placeholder="Subtítulo" class="w-full bg-white border border-[#CFBB99] rounded-xl px-3 py-2 text-xs focus:outline-none">
                <input id="fAuthor" placeholder="Autor *" class="w-full bg-white border border-[#CFBB99] rounded-xl px-3 py-2 text-xs focus:outline-none" required>
                <input id="fCategory" placeholder="Categoria (ex: Conto, Poesia) *" class="w-full bg-white border border-[#CFBB99] rounded-xl px-3 py-2 text-xs focus:outline-none" required>
                <input id="fYear" placeholder="Ano (ex: 2026)" value="2026" class="w-full bg-white border border-[#CFBB99] rounded-xl px-3 py-2 text-xs focus:outline-none">
                <textarea id="fSynopsis" placeholder="Sinopse" class="w-full bg-white border border-[#CFBB99] rounded-xl px-3 py-2 text-xs focus:outline-none h-16"></textarea>
                <input id="fCover" placeholder="URL da Capa" class="w-full bg-white border border-[#CFBB99] rounded-xl px-3 py-2 text-xs focus:outline-none">
                <input id="fPdf" placeholder="URL do PDF Original (opcional)" class="w-full bg-white border border-[#CFBB99] rounded-xl px-3 py-2 text-xs focus:outline-none">
                <textarea id="fPages" placeholder="Páginas em texto (separadas por linhas em branco)" class="w-full bg-white border border-[#CFBB99] rounded-xl px-3 py-2 text-xs focus:outline-none h-16"></textarea>
                <button type="submit" class="w-full bg-[#4C6444] text-white py-2.5 rounded-xl text-xs font-semibold shadow">Salvar Obra</button>
              </form>
            </div>
            <div class="lg:col-span-2 bg-[#F4EFE6] p-5 sm:p-6 rounded-2xl sm:rounded-3xl shadow-lg border border-[#CFBB99] space-y-3.5">
              <h3 class="font-serif font-bold text-base sm:text-lg text-[#102820]">Obras Cadastradas</h3>
              <div class="space-y-2.5 max-h-[350px] sm:max-h-[400px] overflow-y-auto">${booksList}</div>
            </div>
          </div>
        </div>
      `;
    }

    function openBook(id) {
      state.selectedBookId = id;
      switchTab('book-detail');
    }

    function setCategoryFilter(cat) {
      state.selectedCategoryFilter = cat;
      render();
    }

    function handleAdminLogin(e) {
      e.preventDefault();
      const inputPass = document.getElementById('adminPassInput').value;
      if (inputPass === 'admin123') {
        state.isAdminAuth = true;
        render();
      } else {
        alert('Senha incorreta!');
      }
    }

    function handleSaveBook(e) {
      e.preventDefault();
      const rawPages = document.getElementById('fPages').value.trim();
      const pagesArray = rawPages ? rawPages.split(/\n\s*\n/) : ["Página inicial da obra.", "Conteúdo e desenvolvimento.", "Conclusão."];

      const newBook = {
        id: Date.now().toString(),
        title: document.getElementById('fTitle').value,
        subtitle: document.getElementById('fSubtitle').value,
        author: document.getElementById('fAuthor').value,
        category: document.getElementById('fCategory').value,
        year: document.getElementById('fYear').value || '2026',
        synopsis: document.getElementById('fSynopsis').value,
        coverUrl: document.getElementById('fCover').value || 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&q=80&w=600',
        pdfUrl: document.getElementById('fPdf').value.trim(),
        status: 'published',
        featured: true,
        shelf: 'Novas publicações',
        pages: pagesArray
      };

      state.books.unshift(newBook);
      alert('Obra cadastrada com sucesso!');
      document.getElementById('bookForm').reset();
      render();
    }

    function deleteBook(id) {
      if (confirm('Deseja excluir esta obra do acervo?')) {
        state.books = state.books.filter(b => b.id !== id);
        render();
      }
    }

    function openPdfReader(bookId) {
      const book = state.books.find(b => b.id === bookId);
      if (!book) return;
      
      state.currentReadingBook = book;
      document.getElementById('readerBookTitle').textContent = book.title;
      document.getElementById('readerBookAuthor').textContent = book.author;

      const bodyContainer = document.getElementById('readerBodyContainer');
      bodyContainer.innerHTML = '';

      if (book.pdfUrl && book.pdfUrl.length > 5) {
        document.getElementById('pageIndicator').style.display = 'none';
        bodyContainer.innerHTML = `
          <div class="w-full h-full flex flex-col items-center justify-center bg-black/20 p-1 sm:p-4 rounded-xl">
            <iframe src="${escapeHtml(book.pdfUrl)}" class="w-full h-full rounded-lg shadow-2xl bg-white" title="Leitor de PDF"></iframe>
          </div>
        `;
      } else if (book.pages && book.pages.length > 0) {
        document.getElementById('pageIndicator').style.display = 'inline-block';
        state.currentPage = 1;
        state.totalPages = book.pages.length;

        bodyContainer.innerHTML = `
          <div id="bookPageContainer" class="page-flip w-full h-full max-w-4xl bg-[#F9F3EA] text-[#2c221a] p-4 sm:p-12 rounded-xl sm:rounded-r-2xl sm:rounded-l-md shadow-2xl border-l-4 sm:border-l-8 border-[#102820] flex flex-col justify-between overflow-y-auto">
            <div class="border-b border-[#dcd0bc] pb-2 sm:pb-3 mb-3 sm:mb-6 flex justify-between items-center shrink-0">
              <span class="font-serif italic text-xs sm:text-sm text-[#8A6240] truncate pr-2">${escapeHtml(book.title)}</span>
              <span class="text-xs text-gray-500 font-mono shrink-0" id="topPageNum">1</span>
            </div>

            <div id="pageContentText" class="flex-1 font-serif text-sm sm:text-xl leading-relaxed space-y-3 my-auto"></div>

            <div class="pt-3 sm:pt-6 border-t border-[#dcd0bc] flex justify-between items-center mt-3 shrink-0">
              <button onclick="changePage(-1)" class="px-3 sm:px-5 py-2 bg-[#4C6444] text-white rounded-xl text-xs sm:text-sm font-medium hover:bg-[#394c33] transition flex items-center space-x-1 sm:space-x-2 shadow">
                <i data-lucide="chevron-left" class="w-4 h-4"></i><span>Anterior</span>
              </button>
              <span id="bottomPageNum" class="text-xs text-gray-600 font-bold">1 / ${state.totalPages}</span>
              <button onclick="changePage(1)" class="px-3 sm:px-5 py-2 bg-[#4C6444] text-white rounded-xl text-xs sm:text-sm font-medium hover:bg-[#394c33] transition flex items-center space-x-1 sm:space-x-2 shadow">
                <span>Próxima</span><i data-lucide="chevron-right" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        `;
        updateReaderPageContent();
      } else {
        bodyContainer.innerHTML = `<div class="text-center text-white p-6 text-xs sm:text-base">O conteúdo desta obra ainda não está disponível para leitura.</div>`;
      }

      document.getElementById('pdfReaderModal').classList.remove('hidden');
      document.getElementById('closeReaderBtn').focus();
    }

    function closePdfReader() {
      document.getElementById('pdfReaderModal').classList.add('hidden');
      document.getElementById('readerBodyContainer').innerHTML = '';
    }

    function changePage(direction) {
      const newPage = state.currentPage + direction;
      if (newPage < 1 || newPage > state.totalPages) return;

      const container = document.getElementById('bookPageContainer');
      if (!container) return;

      container.classList.add('flipping');

      setTimeout(() => {
        state.currentPage = newPage;
        updateReaderPageContent();
        container.classList.remove('flipping');
      }, 500);
    }

    function updateReaderPageContent() {
      const book = state.currentReadingBook;
      const text = book.pages && book.pages[state.currentPage - 1] ? book.pages[state.currentPage - 1] : `Página ${state.currentPage}`;
      
      const contentElem = document.getElementById('pageContentText');
      if (contentElem) {
        contentElem.innerHTML = `<p>${escapeHtml(text).replace(/\n\n/g, '</p><p>')}</p>`;
      }
      const topNum = document.getElementById('topPageNum');
      if (topNum) topNum.textContent = state.currentPage;

      const botNum = document.getElementById('bottomPageNum');
      if (botNum) botNum.textContent = `${state.currentPage} / ${state.totalPages}`;

      const indicator = document.getElementById('pageIndicator');
      if (indicator) indicator.textContent = `Página ${state.currentPage} de ${state.totalPages}`;
      
      lucide.createIcons();
    }

    window.onload = () => render();
  </script>
</body>
</html>
