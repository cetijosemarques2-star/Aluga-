<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Museu Literário Digital</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Cormorant Garamond & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .font-serif {
      font-family: 'Cormorant Garamond', serif;
    }
    /* Animação de folhear página */
    .page-flip {
      transition: transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.4s ease;
      transform-style: preserve-3d;
      transform-origin: left center;
    }
    .flipping {
      transform: rotateY(-90deg);
      opacity: 0.2;
    }
  </style>
</head>
<body class="bg-[#E5D7C4] text-[#102820] h-screen overflow-hidden flex">

  <!-- ==========================================
      MENU LATERAL ESQUERDO (APP SHELL)
      ========================================== -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-[#102820] text-[#E5D7C4] transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col shadow-2xl">
    <div class="p-6 border-b border-[#4C6444]/40 flex items-center justify-between cursor-pointer" onclick="switchTab('home')">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-lg bg-[#4C6444] flex items-center justify-center shadow-md">
          <i data-lucide="book-open" class="w-6 h-6 text-[#E5D7C4]"></i>
        </div>
        <div>
          <h1 class="font-serif text-lg font-bold tracking-wide text-white">Museu Literário</h1>
          <p class="text-xs text-[#B3B792] tracking-wider uppercase">Digital & Cultural</p>
        </div>
      </div>
      <button onclick="toggleMobileMenu()" class="lg:hidden text-[#B3B792] hover:text-white">
        <i data-lucide="x" class="w-6 h-6"></i>
      </button>
    </div>

    <!-- Navegação Enxuta -->
    <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
      <button onclick="switchTab('home')" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200" data-tab="home">
        <i data-lucide="book-marked" class="w-5 h-5"></i>
        <span>Início</span>
      </button>
      <button onclick="switchTab('catalog')" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200" data-tab="catalog">
        <i data-lucide="library" class="w-5 h-5"></i>
        <span>Acervo Literário</span>
      </button>
      <button onclick="switchTab('gallery')" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200" data-tab="gallery">
        <i data-lucide="image" class="w-5 h-5"></i>
        <span>Galeria Fotográfica</span>
      </button>
      <button onclick="switchTab('audiovisual')" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200" data-tab="audiovisual">
        <i data-lucide="video" class="w-5 h-5"></i>
        <span>Área Audiovisual</span>
      </button>
      <button onclick="switchTab('about')" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200" data-tab="about">
        <i data-lucide="info" class="w-5 h-5"></i>
        <span>Sobre o Museu</span>
      </button>
      <button onclick="switchTab('admin')" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200" data-tab="admin">
        <i data-lucide="shield" class="w-5 h-5"></i>
        <span>Painel Administrativo</span>
      </button>
    </nav>

    <div class="p-4 border-t border-[#4C6444]/40 bg-[#0c1f18] text-xs text-[#B3B792] text-center">
      <p>© 2026 Museu Literário Digital</p>
    </div>
  </aside>

  <!-- Overlay Mobile -->
  <div id="mobileOverlay" onclick="toggleMobileMenu()" class="fixed inset-0 bg-black/60 z-40 lg:hidden hidden backdrop-blur-sm"></div>

  <!-- ==========================================
      CONTEÚDO PRINCIPAL
      ========================================== -->
  <main class="flex-1 flex flex-col lg:pl-72 h-screen overflow-hidden bg-[#E5D7C4]">
    
    <!-- Barra Superior Limpa -->
    <header class="h-16 bg-[#102820] text-[#E5D7C4] px-6 flex items-center justify-between shadow-md z-30 shrink-0">
      <div class="flex items-center space-x-4">
        <button onclick="toggleMobileMenu()" class="lg:hidden p-2 rounded-lg bg-[#4C6444] text-white">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
        <span id="headerTitle" class="font-serif text-lg font-medium text-white">Página Inicial</span>
      </div>
    </header>

    <!-- Área Rolável -->
    <div id="contentArea" class="flex-1 overflow-y-auto">
      <!-- Conteúdo injetado via JS -->
    </div>
  </main>

  <!-- ==========================================
      LEITOR DE LIVRO COM ANIMAÇÃO DE FOLHEAR PÁGINA
      ========================================== -->
  <div id="pdfReaderModal" class="fixed inset-0 z-50 flex flex-col bg-[#2c221a] text-[#F4ECD8] hidden">
    <div id="readerHeader" class="h-16 px-6 flex items-center justify-between border-b border-[#433422] bg-[#1a130f]">
      <div>
        <h3 id="readerBookTitle" class="font-serif font-bold text-base line-clamp-1">Título da Obra</h3>
        <p id="readerBookAuthor" class="text-xs opacity-70">Autor</p>
      </div>
      <div class="flex items-center space-x-3">
        <span id="pageIndicator" class="text-xs font-mono bg-black/30 px-3 py-1.5 rounded-lg">Página 1 de 3</span>
        <button onclick="closePdfReader()" class="bg-red-600 text-white p-2.5 rounded-xl hover:bg-red-700 transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
    
    <!-- Visualizador de Páginas com Efeito de Folha -->
    <div class="flex-1 flex items-center justify-center p-6 perspective-[1500px] overflow-hidden">
      <div id="bookPageContainer" class="page-flip w-full max-w-3xl h-full max-h-[750px] bg-[#F9F3EA] text-[#2c221a] p-10 lg:p-16 rounded-r-2xl rounded-l-md shadow-2xl border-l-8 border-[#102820] flex flex-col justify-between overflow-y-auto">
        <div class="border-b border-[#dcd0bc] pb-4 mb-6 flex justify-between items-center">
          <span class="font-serif italic text-sm text-[#8A6240]" id="readerHeaderBookName">Nome da Obra</span>
          <span class="text-xs text-gray-500 font-mono" id="topPageNum">1</span>
        </div>
        <div id="pageContentText" class="flex-1 font-serif text-lg leading-relaxed space-y-4">
          <!-- Texto da página injetado dinamicamente -->
        </div>
        <div class="pt-6 border-t border-[#dcd0bc] flex justify-between items-center mt-6">
          <button onclick="changePage(-1)" class="px-5 py-2 bg-[#4C6444] text-white rounded-xl text-sm font-medium hover:bg-[#394c33] transition flex items-center space-x-2">
            <i data-lucide="chevron-left" class="w-4 h-4"></i><span>Anterior</span>
          </button>
          <span id="bottomPageNum" class="text-xs text-gray-500 font-bold">1 / 3</span>
          <button onclick="changePage(1)" class="px-5 py-2 bg-[#4C6444] text-white rounded-xl text-sm font-medium hover:bg-[#394c33] transition flex items-center space-x-2">
            <span>Próxima</span><i data-lucide="chevron-right" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==========================================
      SCRIPT DA APLICAÇÃO
      ========================================== -->
  <script>
    let state = {
      activeTab: 'home',
      isAdminAuth: false,
      searchTerm: '',
      selectedCategoryFilter: 'all',
      selectedBookId: null,
      currentPage: 1,
      totalPages: 3,
      
      books: [
        {
          id: '1',
          title: 'Crônicas da Terra Vermelha',
          subtitle: 'Memórias e paisagens do interior',
          author: 'Mariana Silva',
          synopsis: 'Uma coletânea sensível de crônicas sobre a infância no interior, os cheiros da terra molhada, as tardes de outono e a sabedoria dos antigos.',
          category: 'Crônica',
          year: '2025',
          coverUrl: 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&q=80&w=600',
          status: 'published',
          featured: true,
          shelf: 'Crônicas',
          pages: [
            "Capítulo I\n\nA terra vermelha guardava os segredos das primeiras chuvas de novembro. Quando o cheiro de mato molhado subia pelo vale, sabíamos que o tempo havia mudado de ritmo.",
            "As tardes eram longas na varanda da casa de vó. Entre um gole de café coado na hora e histórias contadas à sombra da mangueira, o mundo lá fora parecia distante e seguro.",
            "Hoje, mesmo longe daquela paisagem, basta fechar os olhos para ouvir o vento balançar os cafezais. As raízes que lá deixamos continuam a nutrir quem somos."
          ]
        },
        {
          id: '2',
          title: 'Versos do Sertão Verde',
          subtitle: 'Poesia popular e contemporânea',
          author: 'Antônio Bezerra',
          synopsis: 'Poemas que cantam a força da caatinga, a resiliência do povo nordestino e a beleza das chuvas que transformam a paisagem.',
          category: 'Poesia',
          year: '2026',
          coverUrl: 'https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&q=80&w=600',
          status: 'published',
          featured: true,
          shelf: 'Literatura nordestina',
          pages: [
            "I\n\nQuando o verde desponta na terra seca,\nO sertanejo sorri pro céu anil.\nA viola ponteia a alma que seca,\nNo canto mais forte do meu Brasil.",
            "II\n\nNão há sol que desande a esperança,\nDe quem planta o milho e espera o chão.\nNa alma do povo há sempre uma dança,\nDe fé e coragem no coração.",
            "III\n\nTerra de luz, de poesia e encanto,\nOnde o verso brota igual flor no agreste.\nQuem bebe dessa água e enxuga o pranto,\nLeva o nordeste gravado no peito."
          ]
        }
      ],
      categories: ['Conto', 'Crônica', 'Poesia', 'Literatura nordestina', 'Produção escolar'],
      gallery: [
        { id: '1', title: 'Oficina de Contação de Histórias', description: 'Alunos reunidos na biblioteca ao ar livre.', imageUrl: 'https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&q=80&w=800', date: 'Agosto, 2026', project: 'Festival' }
      ],
      videos: [
        { id: '1', title: 'Documentário: Vozes da Terra', description: 'Panorama sobre literatura oral.', videoUrl: 'https://www.youtube.com/embed/dQw4w9WgXcQ', category: 'Documentário' }
      ]
    };

    const shelvesConfig = [
      { title: 'Obras em destaque', shelfName: 'Obras em destaque' },
      { title: 'Crônicas', shelfName: 'Crônicas' },
      { title: 'Literatura nordestina', shelfName: 'Literatura nordestina' },
      { title: 'Novas publicações', shelfName: 'Novas publicações' }
    ];

    function switchTab(tab) {
      state.activeTab = tab;
      render();
      closeMobileMenu();
    }

    function toggleMobileMenu() {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
      document.getElementById('mobileOverlay').classList.toggle('hidden');
    }

    function closeMobileMenu() {
      document.getElementById('sidebar').classList.add('-translate-x-full');
      document.getElementById('mobileOverlay').classList.add('hidden');
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeMobileMenu();
        closePdfReader();
      }
    });

    function render() {
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const tab = btn.getAttribute('data-tab');
        if (tab === state.activeTab || (state.activeTab === 'book-detail' && tab === 'catalog')) {
          btn.className = 'nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium bg-[#4C6444] text-white shadow-lg';
        } else {
          btn.className = 'nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium text-[#B3B792] hover:bg-[#15352a] hover:text-white transition-all';
        }
      });

      const titles = {
        home: 'Página Inicial',
        catalog: 'Acervo Completo',
        'book-detail': 'Detalhes da Obra',
        gallery: 'Galeria Fotográfica',
        audiovisual: 'Área Audiovisual',
        about: 'Sobre o Projeto',
        admin: 'Painel Administrativo'
      };
      
      document.getElementById('headerTitle').textContent = titles[state.activeTab] || 'Museu Literário';

      const area = document.getElementById('contentArea');
      area.innerHTML = '';

      if (state.activeTab === 'home') area.innerHTML = renderHome();
      else if (state.activeTab === 'catalog') area.innerHTML = renderCatalog();
      else if (state.activeTab === 'book-detail') area.innerHTML = renderBookDetail();
      else if (state.activeTab === 'gallery') area.innerHTML = renderGallery();
      else if (state.activeTab === 'audiovisual') area.innerHTML = renderAudiovisual();
      else if (state.activeTab === 'about') area.innerHTML = renderAbout();
      else if (state.activeTab === 'admin') area.innerHTML = renderAdmin();

      lucide.createIcons();
    }

    function renderHome() {
      let shelvesHtml = shelvesConfig.map(shelf => {
        const shelfBooks = state.books.filter(b => b.status === 'published' && (b.shelf === shelf.shelfName || (shelf.shelfName === 'Obras em destaque' && b.featured)));
        if (shelfBooks.length === 0) return '';

        let booksCards = shelfBooks.map(book => `
          <div class="w-56 shrink-0 bg-[#F4EFE6] rounded-2xl shadow-md overflow-hidden border border-[#CFBB99]/60 flex flex-col group">
            <div class="relative h-72 overflow-hidden bg-[#d3c1a5]">
              <img src="${book.coverUrl}" alt="${book.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
              <div class="absolute top-3 left-3 bg-[#102820]/80 text-[#E5D7C4] text-[10px] px-2.5 py-1 rounded-full font-semibold uppercase">
                ${book.category}
              </div>
            </div>
            <div class="p-4 flex-1 flex flex-col justify-between">
              <div>
                <h3 class="font-serif font-bold text-base text-[#102820] line-clamp-1">${book.title}</h3>
                <p class="text-xs text-[#8A6240] font-medium mt-0.5 line-clamp-1">${book.author}</p>
              </div>
              <div class="mt-4 pt-3 border-t border-[#CFBB99]/40 flex items-center justify-between">
                <span class="text-[11px] text-[#889063] font-semibold">${book.year}</span>
                <button onclick="openBook('${book.id}')" class="bg-[#4C6444] hover:bg-[#394c33] text-white text-xs px-3 py-1.5 rounded-lg font-medium transition shadow">
                  Ler
                </button>
              </div>
            </div>
          </div>
        `).join('');

        return `
          <div class="space-y-4">
            <div class="flex items-center justify-between border-b border-[#889063]/30 pb-2">
              <h2 class="text-2xl font-serif font-bold text-[#102820] flex items-center space-x-2">
                <span class="w-2.5 h-2.5 rounded-full bg-[#4C6444]"></span>
                <span>${shelf.title}</span>
              </h2>
            </div>
            <div class="flex space-x-6 overflow-x-auto pb-4 pt-2 scrollbar-thin">
              ${booksCards}
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="min-h-full flex flex-col">
          <div class="bg-[#102820] text-white py-16 px-8 flex flex-col items-center justify-center text-center shadow-xl">
            <h1 class="text-4xl lg:text-5xl font-serif font-bold text-[#E5D7C4] leading-tight">
              “Um lugar para as histórias viverem.”
            </h1>
            <p class="text-base lg:text-lg text-[#B3B792] font-light max-w-xl mx-auto mt-3">
              Explore livros, poemas e memórias que atravessam gerações.
            </p>
            <button onclick="switchTab('catalog')" class="mt-6 bg-[#4C6444] hover:bg-[#5d7954] text-white px-8 py-3 rounded-xl font-medium shadow transition">
              Explorar Acervo
            </button>
          </div>
          <div class="py-12 px-6 lg:px-12 space-y-12 max-w-7xl mx-auto w-full">
            ${shelvesHtml}
          </div>
        </div>
      `;
    }

    function renderCatalog() {
      let categoriesBtns = `<button onclick="setCategoryFilter('all')" class="px-4 py-2 rounded-xl text-xs font-semibold shadow-sm ${state.selectedCategoryFilter === 'all' ? 'bg-[#102820] text-white' : 'bg-[#F4EFE6] text-[#4D2D18]'}">Todas</button>`;
      categoriesBtns += state.categories.map(c => `
        <button onclick="setCategoryFilter('${c}')" class="px-4 py-2 rounded-xl text-xs font-semibold shadow-sm ${state.selectedCategoryFilter === c ? 'bg-[#102820] text-white' : 'bg-[#F4EFE6] text-[#4D2D18]'}">${c}</button>
      `).join('');

      return `
        <div class="p-6 lg:p-12 max-w-7xl mx-auto space-y-8">
          <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
              <h1 class="text-3xl font-serif font-bold text-[#102820]">Acervo Literário</h1>
              <p class="text-sm text-[#4D2D18] mt-1">Pesquise por títulos ou autores.</p>
            </div>
            <div class="relative w-full md:w-80">
              <i data-lucide="search" class="absolute left-3.5 top-3 w-4 h-4 text-[#8A6240]"></i>
              <input type="text" placeholder="Pesquisar..." value="${state.searchTerm}" oninput="state.searchTerm = this.value; renderCatalogGrid()" class="w-full bg-[#F4EFE6] border border-[#CFBB99] rounded-xl pl-10 pr-4 py-2 text-sm focus:outline-none">
            </div>
          </div>
          <div class="flex items-center space-x-2 overflow-x-auto pb-2">${categoriesBtns}</div>
          <div id="booksGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            ${getFilteredBooksHTML()}
          </div>
        </div>
      `;
    }

    function getFilteredBooksHTML() {
      let filtered = state.books.filter(b => b.status === 'published')
        .filter(b => state.selectedCategoryFilter === 'all' || b.category === state.selectedCategoryFilter)
        .filter(b => b.title.toLowerCase().includes(state.searchTerm.toLowerCase()) || b.author.toLowerCase().includes(state.searchTerm.toLowerCase()));

      if (filtered.length === 0) return `<div class="col-span-full py-12 text-center text-sm text-[#8A6240]">Nenhuma obra encontrada.</div>`;

      return filtered.map(book => `
        <div class="bg-[#F4EFE6] rounded-2xl shadow-md overflow-hidden border border-[#CFBB99] flex flex-col">
          <div class="relative h-72 bg-[#d3c1a5] overflow-hidden">
            <img src="${book.coverUrl}" class="w-full h-full object-cover">
            <div class="absolute top-3 left-3 bg-[#102820]/80 text-[#E5D7C4] text-[10px] px-2.5 py-1 rounded-full font-semibold">
              ${book.category}
            </div>
          </div>
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <h3 class="font-serif font-bold text-base text-[#102820] line-clamp-1">${book.title}</h3>
              <p class="text-xs text-[#8A6240] font-medium mt-0.5">${book.author}</p>
            </div>
            <div class="mt-4 pt-3 border-t border-[#CFBB99] flex items-center justify-between">
              <span class="text-xs text-[#889063] font-semibold">${book.year}</span>
              <button onclick="openBook('${book.id}')" class="bg-[#4C6444] text-white text-xs px-4 py-2 rounded-lg font-medium shadow">Ver Detalhes</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderCatalogGrid() {
      const grid = document.getElementById('booksGrid');
      if (grid) grid.innerHTML = getFilteredBooksHTML();
    }

    function renderBookDetail() {
      const book = state.books.find(b => b.id === state.selectedBookId);
      if (!book) return `<div class="p-12 text-center">Obra não encontrada. <button onclick="switchTab('catalog')" class="text-[#4C6444] underline">Voltar</button></div>`;

      return `
        <div class="p-6 lg:p-12 max-w-4xl mx-auto space-y-8">
          <button onclick="switchTab('catalog')" class="flex items-center space-x-2 text-[#4C6444] font-medium text-sm">
            <i data-lucide="chevron-left" class="w-5 h-5"></i><span>Voltar ao Acervo</span>
          </button>
          <div class="bg-[#F4EFE6] rounded-3xl p-8 shadow-xl border border-[#CFBB99] grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="md:col-span-1">
              <div class="rounded-2xl overflow-hidden shadow-2xl aspect-[3/4] border border-[#CFBB99]">
                <img src="${book.coverUrl}" class="w-full h-full object-cover">
              </div>
              <button onclick="openPdfReader('${book.id}')" class="w-full mt-4 flex items-center justify-center space-x-2 bg-[#4C6444] hover:bg-[#394c33] text-white py-3.5 px-4 rounded-xl font-medium shadow transition">
                <i data-lucide="book-open" class="w-5 h-5"></i><span>Ler Obra</span>
              </button>
            </div>
            <div class="md:col-span-2 space-y-4">
              <span class="bg-[#102820] text-[#E5D7C4] text-xs px-3 py-1 rounded-full uppercase">${book.category}</span>
              <h1 class="text-3xl font-serif font-bold text-[#102820]">${book.title}</h1>
              <p class="text-base text-[#8A6240] font-serif italic">${book.subtitle || ''}</p>
              <p class="text-sm font-semibold text-[#4C6444]">Autor: ${book.author}</p>
              <div class="border-t border-[#CFBB99] pt-4">
                <h3 class="font-serif font-bold text-lg text-[#102820] mb-2">Sinopse</h3>
                <p class="text-sm text-[#4D2D18] leading-relaxed">${book.synopsis}</p>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderGallery() {
      let cards = state.gallery.map(item => `
        <div class="bg-[#F4EFE6] rounded-2xl overflow-hidden shadow-md border border-[#CFBB99] flex flex-col">
          <div class="h-64 bg-[#d3c1a5] relative">
            <img src="${item.imageUrl}" class="w-full h-full object-cover">
          </div>
          <div class="p-5">
            <h3 class="font-serif font-bold text-lg text-[#102820]">${item.title}</h3>
            <p class="text-xs text-[#4D2D18] mt-2">${item.description}</p>
          </div>
        </div>
      `).join('');

      return `<div class="p-6 lg:p-12 max-w-7xl mx-auto space-y-8"><h1 class="text-3xl font-serif font-bold text-[#102820]">Galeria Fotográfica</h1><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">${cards}</div></div>`;
    }

    function renderAudiovisual() {
      let cards = state.videos.map(vid => `
        <div class="bg-[#F4EFE6] rounded-2xl overflow-hidden shadow-md border border-[#CFBB99]">
          <div class="aspect-video bg-black">
            <iframe src="${vid.videoUrl}" class="w-full h-full" allowfullscreen></iframe>
          </div>
          <div class="p-6 space-y-2">
            <h3 class="font-serif font-bold text-xl text-[#102820]">${vid.title}</h3>
            <p class="text-sm text-[#4D2D18]">${vid.description}</p>
          </div>
        </div>
      `).join('');

      return `<div class="p-6 lg:p-12 max-w-7xl mx-auto space-y-8"><h1 class="text-3xl font-serif font-bold text-[#102820]">Área Audiovisual</h1><div class="grid grid-cols-1 lg:grid-cols-2 gap-8">${cards}</div></div>`;
    }

    function renderAbout() {
      return `
        <div class="p-6 lg:p-12 max-w-4xl mx-auto">
          <div class="bg-[#F4EFE6] rounded-3xl p-8 lg:p-12 shadow-xl border border-[#CFBB99] space-y-6">
            <h1 class="text-3xl lg:text-4xl font-serif font-bold text-[#102820]">Sobre o Museu Literário Digital</h1>
            <p class="text-base text-[#4D2D18] leading-relaxed">
              Plataforma dedicada à preservação, organização e divulgação da literatura e produções culturais.
            </p>
          </div>
        </div>
      `;
    }

    function renderAdmin() {
      if (!state.isAdminAuth) {
        return `
          <div class="max-w-md mx-auto bg-[#F4EFE6] rounded-3xl p-8 shadow-2xl border border-[#CFBB99] space-y-6 mt-12">
            <div class="text-center space-y-2">
              <i data-lucide="shield" class="w-12 h-12 text-[#4C6444] mx-auto"></i>
              <h2 class="text-2xl font-serif font-bold text-[#102820]">Área Restrita</h2>
              <p class="text-xs text-[#4D2D18]">Senha padrão: admin123</p>
            </div>
            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
              <input id="adminPassInput" type="password" placeholder="Senha..." class="w-full bg-white border border-[#CFBB99] rounded-xl px-4 py-3 text-sm" required>
              <button type="submit" class="w-full bg-[#102820] text-white py-3 rounded-xl font-medium shadow-lg">Entrar</button>
            </form>
          </div>
        `;
      }

      let booksList = state.books.map(b => `
        <div class="bg-white p-4 rounded-2xl border border-[#CFBB99] flex items-center justify-between shadow-sm">
          <div>
            <h4 class="font-serif font-bold text-sm text-[#102820]">${b.title}</h4>
            <p class="text-xs text-[#8A6240]">${b.author} • ${b.category}</p>
          </div>
          <button onclick="deleteBook('${b.id}')" class="p-2 bg-red-100 text-red-700 rounded-lg"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
        </div>
      `).join('');

      return `
        <div class="p-6 lg:p-12 max-w-7xl mx-auto space-y-8">
          <div class="flex items-center justify-between bg-[#F4EFE6] p-4 rounded-2xl border border-[#CFBB99]">
            <span class="text-sm font-bold text-[#102820]">Painel Administrativo</span>
            <button onclick="state.isAdminAuth=false; render();" class="text-xs text-red-700 font-semibold">Sair</button>
          </div>
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="bg-[#F4EFE6] p-6 rounded-3xl shadow-lg border border-[#CFBB99] space-y-4">
              <h3 class="font-serif font-bold text-lg text-[#102820]">Cadastrar Obra</h3>
              <form id="bookForm" onsubmit="handleSaveBook(event)" class="space-y-3">
                <input id="fTitle" placeholder="Título *" class="w-full bg-white border border-[#CFBB99] rounded-xl px-3 py-2 text-xs" required>
                <input id="fAuthor" placeholder="Autor *" class="w-full bg-white border border-[#CFBB99] rounded-xl px-3 py-2 text-xs" required>
                <input id="fCategory" placeholder="Categoria *" class="w-full bg-white border border-[#CFBB99] rounded-xl px-3 py-2 text-xs" required>
                <textarea id="fSynopsis" placeholder="Sinopse" class="w-full bg-white border border-[#CFBB99] rounded-xl px-3 py-2 text-xs"></textarea>
                <input id="fCover" placeholder="URL da Capa" class="w-full bg-white border border-[#CFBB99] rounded-xl px-3 py-2 text-xs">
                <button type="submit" class="w-full bg-[#4C6444] text-white py-2.5 rounded-xl text-xs font-semibold shadow">Salvar</button>
              </form>
            </div>
            <div class="lg:col-span-2 bg-[#F4EFE6] p-6 rounded-3xl shadow-lg border border-[#CFBB99] space-y-4">
              <h3 class="font-serif font-bold text-lg text-[#102820]">Obras Cadastradas</h3>
              <div class="space-y-3 max-h-[400px] overflow-y-auto">${booksList}</div>
            </div>
          </div>
        </div>
      `;
    }

    function openBook(id) {
      state.selectedBookId = id;
      switchTab('book-detail');
    }

    function setCategoryFilter(cat) {
      state.selectedCategoryFilter = cat;
      render();
    }

    function handleAdminLogin(e) {
      e.preventDefault();
      if (document.getElementById('adminPassInput').value === 'admin123') {
        state.isAdminAuth = true;
        render();
      } else {
        alert('Senha incorreta! Use: admin123');
      }
    }

    function handleSaveBook(e) {
      e.preventDefault();
      const newBook = {
        id: Date.now().toString(),
        title: document.getElementById('fTitle').value,
        author: document.getElementById('fAuthor').value,
        category: document.getElementById('fCategory').value,
        synopsis: document.getElementById('fSynopsis').value,
        coverUrl: document.getElementById('fCover').value || 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&q=80&w=600',
        year: '2026',
        status: 'published',
        featured: true,
        shelf: 'Novas publicações',
        pages: ["Página inicial da obra.", "Conteúdo intermediário da história.", "Conclusão e considerações finais."]
      };
      state.books.unshift(newBook);
      alert('Obra cadastrada com sucesso!');
      document.getElementById('bookForm').reset();
      render();
    }

    function deleteBook(id) {
      if (confirm('Deseja excluir esta obra?')) {
        state.books = state.books.filter(b => b.id !== id);
        render();
      }
    }

    // --- LEITOR COM ANIMAÇÃO DE FOLHA ---
    function openPdfReader(bookId) {
      const book = state.books.find(b => b.id === bookId);
      if (!book) return;
      
      state.currentReadingBook = book;
      state.currentPage = 1;
      state.totalPages = book.pages ? book.pages.length : 3;

      document.getElementById('readerBookTitle').textContent = book.title;
      document.getElementById('readerBookAuthor').textContent = book.author;
      document.getElementById('readerHeaderBookName').textContent = book.title;

      updateReaderPageContent();
      document.getElementById('pdfReaderModal').classList.remove('hidden');
    }

    function closePdfReader() {
      document.getElementById('pdfReaderModal').classList.add('hidden');
    }

    function changePage(direction) {
      const newPage = state.currentPage + direction;
      if (newPage < 1 || newPage > state.totalPages) return;

      const container = document.getElementById('bookPageContainer');
      
      container.classList.add('flipping');

      setTimeout(() => {
        state.currentPage = newPage;
        updateReaderPageContent();
        container.classList.remove('flipping');
      }, 300);
    }

    function updateReaderPageContent() {
      const book = state.currentReadingBook;
      const text = book.pages ? book.pages[state.currentPage - 1] : `Conteúdo da página ${state.currentPage}`;
      
      document.getElementById('pageContentText').innerHTML = `<p>${text.replace(/\n\n/g, '</p><p>')}</p>`;
      document.getElementById('topPageNum').textContent = state.currentPage;
      document.getElementById('bottomPageNum').textContent = `${state.currentPage} / ${state.totalPages}`;
      document.getElementById('pageIndicator').textContent = `Página ${state.currentPage} de ${state.totalPages}`;
    }

    window.onload = () => render();
  </script>
</body>
</html>
